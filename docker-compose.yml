x-django-env: &django-env
  DATABASE_URL: postgres://alora:alora_password@db:5432/alora
  REDIS_URL: redis://redis:6379/0
  DJANGO_SETTINGS_MODULE: config.settings.dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alora
      POSTGRES_PASSWORD: alora_password
      POSTGRES_DB: alora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alora -d alora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    environment:
      <<: *django-env
      # Go agent (alora-ai repo compose'i shu tarmoqqa "agent" nomi bilan ulanadi)
      GRPC_AGENT_ADDR: ${GRPC_AGENT_ADDR:-agent:9090}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN is required}
    volumes:
      # collectstatic natijasi va media — nginx bilan umumiy
      - static_files:/app/static
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  grpc:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python manage.py run_grpc
    environment:
      <<: *django-env
      GRPC_PORT: 9091
      GRPC_MAX_WORKERS: 16
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?AGENT_SERVICE_TOKEN is required}
    expose:
      - "9091"
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 9091), 2); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l INFO -Q default,usage --concurrency=4
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker_heavy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l INFO -Q heavy --concurrency=2
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l INFO
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/app/static:ro
      - media_files:/app/media:ro
    depends_on:
      django:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  media_files:
