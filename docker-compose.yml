services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: alora
      POSTGRES_PASSWORD: alora_password
      POSTGRES_DB: alora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  django:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://alora:alora_password@db:5432/alora
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l INFO -Q default,usage --concurrency=4
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://alora:alora_password@db:5432/alora
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - redis
      - db

  celery_worker_heavy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config worker -l INFO -Q heavy --concurrency=2
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://alora:alora_password@db:5432/alora
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - redis
      - db

  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A config beat -l INFO
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://alora:alora_password@db:5432/alora
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=config.settings.dev
    depends_on:
      - redis
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - django

volumes:
  postgres_data:
