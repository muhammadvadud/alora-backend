name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alora
          POSTGRES_PASSWORD: alora_password
          POSTGRES_DB: alora
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt', 'pyproject.toml') }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        
    - name: Run Ruff Linting
      run: |
        ruff check .

    - name: Run Ruff Formatting Check
      run: |
        ruff format --check .
        
    - name: Run Mypy
      run: |
        mypy .

    - name: Migratsiyalar to'liqligini tekshirish
      run: python manage.py makemigrations --check --dry-run

    - name: Deploy sozlamalarini tekshirish
      env:
        DJANGO_SETTINGS_MODULE: config.settings.prod
        SECRET_KEY: ci-only-key
        ALLOWED_HOSTS: example.com
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        REDIS_URL: redis://localhost:6379/0
      run: python manage.py check --deploy --fail-level WARNING

    - name: requirements.txt sinxronligini tekshirish
      run: |
        python scripts/gen_requirements.py
        git diff --exit-code requirements.txt requirements-dev.txt

    - name: Stub qoldiqlarini tekshirish
      run: |
        ! grep -rn "returning 200 for now\|TODO: implement\|FIXME" apps/ config/
        
    - name: Run Tests with Coverage
      env:
        DATABASE_URL: postgres://alora:alora_password@localhost:5432/alora
        REDIS_URL: redis://localhost:6379/0
        DJANGO_SETTINGS_MODULE: config.settings.dev
      run: |
        pytest --cov-report=xml --cov-fail-under=70
        
    - name: Upload coverage
      uses: codecov/codecov-action@v4

    - name: Run pip-audit
      if: always()
      run: |
        pip-audit

    - name: Run detect-secrets
      if: always()
      run: |
        python -m pip install detect-secrets
        detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
