services:
  django:
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app

  celery_worker:
    volumes:
      - .:/app

  celery_worker_heavy:
    volumes:
      - .:/app

  celery_beat:
    # /app host'dan mount (uid farqi) — jadval fayli /tmp ga
    command: celery -A config beat -l INFO --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
