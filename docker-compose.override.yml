services:
  django:
    # runserver WSGI (daphne yo'q) — ovozli WS ishlamaydi; dev ham prod kabi ASGI
    # (uvicorn) da, --reload kod o'zgarishini kuzatadi (rules.md 17.6).
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  celery_worker:
    volumes:
      - .:/app

  celery_worker_heavy:
    volumes:
      - .:/app

  celery_beat:
    # /app host'dan mount (uid farqi) — jadval fayli /tmp ga
    command: celery -A config beat -l INFO --schedule /tmp/celerybeat-schedule
    volumes:
      - .:/app
