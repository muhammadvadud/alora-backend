[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Django loyihasi paket sifatida tarqatilmaydi, faqat bog'liqliklar uchun
packages = ["apps", "config"]

[project]
name = "alora-backend"
version = "0.1.0"
description = "Alora backend loyihasi"
requires-python = ">=3.13"
dependencies = [
    "django==5.*",
    "djangorestframework",
    "djangorestframework-simplejwt",
    "django-filter",
    "django-unfold",
    "psycopg[binary]",
    "dj-database-url",
    "redis",
    "celery",
    "django-environ",
    "channels",
    "channels-redis",
    "structlog",
    "sentry-sdk",
    "grpcio",
    "grpcio-tools",
    "drf-spectacular",
    "Pillow",
    "openpyxl",
    "reportlab",
    "argon2-cffi",
    "uvicorn",
    "websockets",
    "gunicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "factory-boy",
    "ruff",
    "mypy",
    "django-stubs",
    "djangorestframework-stubs",
    "celery-types",
    "types-redis",
    "types-reportlab",
    "types-openpyxl",
    "grpc-stubs",
    "pre-commit",
    "pip-audit"
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "grpc_gen",
    "__pycache__",
    "migrations"
]

[tool.ruff.lint]
# RUF012 — "Mutable default value for class attribute".
# DRF ning standart yozuvi (`permission_classes = [IsManager]`,
# `filter_backends = [...]`) shu qoidani buzadi, `rules.md` §4.4 esa aynan
# shu yozuvni MAJBURIY qiladi. Sabab va muqobil variantlar: rules.md §17.3.
ignore = ["RUF012"]

[tool.mypy]
python_version = "3.13"
strict_optional = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/", "venv/", ".venv/", "grpc_gen/", "tests/"]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "channels.*",
    "channels_redis.*",
    "environ.*",
    "dj_database_url.*",
    "django_filters.*",
    "reportlab.*",
    "weasyprint.*",
    "grpc.*",
    "google.protobuf.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true


# VAQTINCHA — mypy qamrovini bosqichma-bosqich kengaytirish uchun.
# Har sprintda kamida 2 modul bu ro'yxatdan olib tashlanadi va xatolari tuzatiladi.
[[tool.mypy.overrides]]
module = [
    "apps.accounts.models",
    "apps.accounts.serializers",
    "apps.catalog.serializers",
    "apps.catalog.tasks",
    "apps.chat.grpc_server.catalog_service",
    "apps.common.factories",
    "apps.common.models",
    "apps.knowledge.views",
    "apps.orders.serializers",
    "apps.orders.services",
    "apps.orders.views",
    "apps.pricing.views",
    "apps.usage.views",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py"]
# Migratsiyalar ham tekshiriladi (--nomigrations qo'yilmaydi: seed migratsiyasi ishlashi shart).
# HTML qamrov hisoboti faqat kerak bo'lganda: pytest --cov-report=html
addopts = "--cov=apps --cov=config --cov-report=term-missing:skip-covered"
